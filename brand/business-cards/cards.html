<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>KO Marketing Agency — business cards</title>
  <!--
    Thai business card, 90 × 55 mm trim.
    Print sheet 108 × 73 mm: 3 mm bleed, crop marks outside the bleed.
    Preview (?preview) shows the trim only.
    Silk and glass are opaque rasters at 600 dpi. Logo, type, and QR are vectors.
    No opacity, masks, or blend modes.
  -->
  <style>
    @font-face {
      font-family: "Source Serif 4";
      font-style: italic;
      font-weight: 500;
      font-display: block;
      src: url("fonts/source-serif-4-latin-500-italic.woff2") format("woff2");
    }
    @font-face {
      font-family: Manrope;
      font-style: normal;
      font-weight: 400;
      font-display: block;
      src: url("fonts/manrope-latin-400-normal.woff2") format("woff2");
    }
    @font-face {
      font-family: Manrope;
      font-style: normal;
      font-weight: 500;
      font-display: block;
      src: url("fonts/manrope-latin-500-normal.woff2") format("woff2");
    }

    @page { size: 108mm 73mm; margin: 0; }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { background: #4c050c; color: #ffffff; }

    .sheet {
      position: relative;
      width: 108mm;
      height: 73mm;
      background: #ffffff;
      overflow: hidden;
      page-break-after: always;
      break-after: page;
    }
    .sheet:last-child {
      page-break-after: auto;
      break-after: auto;
    }

    .bleed {
      position: absolute;
      left: 6mm;
      top: 6mm;
      width: 96mm;
      height: 61mm;
      background: #4c050c;
      overflow: hidden;
    }

    .bg {
      position: absolute;
      left: 0;
      top: 0;
      width: 96mm;
      height: 61mm;
    }

    .mark { position: absolute; background: #000000; }
    .mark.h { height: 0.1mm; width: 4.5mm; }
    .mark.v { width: 0.1mm; height: 4.5mm; }
    .h-tl { left: 1.5mm; top: 8.95mm; }
    .v-tl { left: 8.95mm; top: 1.5mm; }
    .h-tr { left: 102mm; top: 8.95mm; }
    .v-tr { left: 98.95mm; top: 1.5mm; }
    .h-bl { left: 1.5mm; top: 63.95mm; }
    .v-bl { left: 8.95mm; top: 67mm; }
    .h-br { left: 102mm; top: 63.95mm; }
    .v-br { left: 98.95mm; top: 67mm; }

    .front {
      position: absolute;
      left: 12mm;
      top: 13.2mm;
      width: 48mm;
      height: 34.6mm;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      text-align: left;
    }

    .wordmark { width: 44mm; height: auto; display: block; }

    .tagline {
      margin-top: 2.6mm;
      font-family: "Source Serif 4", serif;
      font-style: italic;
      font-weight: 500;
      font-size: 12pt;
      line-height: 1.05;
      letter-spacing: -0.045em;
      color: #ffffff;
    }

    .name {
      position: absolute;
      left: 11.2mm;
      top: 8.0mm;
      font-family: "Source Serif 4", serif;
      font-style: italic;
      font-weight: 500;
      font-size: 13.5pt;
      line-height: 1.05;
      letter-spacing: -0.03em;
      color: #ffffff;
    }

    .role {
      position: absolute;
      left: 11.4mm;
      top: 14.15mm;
      font-family: Manrope, sans-serif;
      font-weight: 500;
      font-size: 8pt;
      line-height: 1.2;
      letter-spacing: -0.01em;
      color: #ffffff;
    }

    .line {
      position: absolute;
      left: 10.6mm;
      width: 45.2mm;
      height: 5.15mm;
      display: flex;
      align-items: center;
      padding-left: 3.3mm;
      font-family: Manrope, sans-serif;
      font-weight: 500;
      font-size: 7.5pt;
      line-height: 1;
      letter-spacing: -0.015em;
      color: #ffffff;
      white-space: nowrap;
    }
    .l1 { top: 19.4mm; }
    .l2 { top: 25.55mm; }
    .l3 { top: 31.7mm; }
    .l4 { top: 37.85mm; }

    .qr {
      position: absolute;
      left: 61mm;
      top: 18.6mm;
      width: 23.8mm;
      height: 23.8mm;
    }
    .qr img {
      width: 23.8mm;
      height: 23.8mm;
      display: block;
    }

    html.preview .mark { display: none; }
    html.preview .sheet { width: 90mm; height: 55mm; }
    html.preview .bleed { left: -3mm; top: -3mm; }
  </style>
</head>
<body>
  <section class="sheet" data-face="front">
    <div class="bleed">
      <img class="bg" src="assets/front-bg.png" alt="">
      <div class="front">
        <img class="wordmark" src="assets/ko-wordmark.svg" alt="KO Marketing Agency">
        <p class="tagline">Marketing that<br>converts.</p>
      </div>
    </div>
    <div class="mark h h-tl"></div><div class="mark v v-tl"></div>
    <div class="mark h h-tr"></div><div class="mark v v-tr"></div>
    <div class="mark h h-bl"></div><div class="mark v v-bl"></div>
    <div class="mark h h-br"></div><div class="mark v v-br"></div>
  </section>

  <section class="sheet" data-face="back-lisa-maretti">
    <div class="bleed">
      <img class="bg" src="assets/back-bg.png" alt="">
      <p class="name">Lisa Maretti</p>
      <p class="role">Co-founder</p>
      <p class="line l1">+66 65 073 9612</p>
      <p class="line l2">lisa@komarketingagency.com</p>
      <p class="line l3">komarketingagency.com</p>
      <p class="line l4">Sukhumvit 24, Bangkok</p>
      <div class="qr"><img src="assets/qr.svg" alt=""></div>
    </div>
    <div class="mark h h-tl"></div><div class="mark v v-tl"></div>
    <div class="mark h h-tr"></div><div class="mark v v-tr"></div>
    <div class="mark h h-bl"></div><div class="mark v v-bl"></div>
    <div class="mark h h-br"></div><div class="mark v v-br"></div>
  </section>

  <section class="sheet" data-face="back-kristina-ostapenko">
    <div class="bleed">
      <img class="bg" src="assets/back-bg.png" alt="">
      <p class="name">Kristina Ostapenko</p>
      <p class="role">Co-founder</p>
      <p class="line l1">+66 99 119 7242</p>
      <p class="line l2">kristina@komarketingagency.com</p>
      <p class="line l3">komarketingagency.com</p>
      <p class="line l4">Sukhumvit 24, Bangkok</p>
      <div class="qr"><img src="assets/qr.svg" alt=""></div>
    </div>
    <div class="mark h h-tl"></div><div class="mark v v-tl"></div>
    <div class="mark h h-tr"></div><div class="mark v v-tr"></div>
    <div class="mark h h-bl"></div><div class="mark v v-bl"></div>
    <div class="mark h h-br"></div><div class="mark v v-br"></div>
  </section>
  <script>
    if (location.search.indexOf("preview") !== -1) {
      document.documentElement.classList.add("preview");
      var fix = document.createElement("style");
      fix.textContent = "@page { size: 90mm 55mm; margin: 0; }";
      document.head.appendChild(fix);
    }
  </script>
</body>
</html>
